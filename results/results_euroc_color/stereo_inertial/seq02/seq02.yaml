  data: [0.999942059, -0.007423526464, -0.007795163279, -0.03446766366, 0.007420570877, 0.9999723648, -0.0004080089835, -0.004611904262, 0.007797976476, 0.0003501407763, 0.999969526, -0.0002705709946, 0.0, 0.0, 0.0, 1.0]
